<!DOCTYPE html>
<html>
<head>
    <title>Volunteers - NGO Support Finder</title>
    <link rel="stylesheet" href="/static/style.css">
    <script>if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');</script>
</head>
<body>
    <header class="modern-header">
        <div class="logo-container">
            <span class="logo-icon">💙</span>
            <span class="logo-text">NGO Support Finder</span>
        </div>
        <nav class="modern-nav">
            <a href="/admin" class="modern-nav-link">Back to Admin</a>
            <button onclick="toggleTheme()" class="theme-toggle-btn">🌗 Theme</button>
        </nav>
    </header>

    <div class="modern-bg">
        <div class="modern-card wide">
            <h2 style="margin-bottom:20px;">Volunteer Applications</h2>
            <table class="modern-table">
                <tr><th>Name</th><th>Applying To</th><th>Phone</th><th>Skills</th><th>Date</th></tr>
                {% for vol in volunteers %}
                <tr>
                    <td><strong>{{ vol['name'] }}</strong></td>
                    <td>{{ vol['ngo_name'] }}</td>
                    <td>{{ vol['phone'] }}</td>
                    <td>{{ vol['skills'] }}</td>
                    <td style="font-size:0.9em; color:var(--text-muted);">{{ vol['date_applied'] }}</td>
                </tr>
                {% endfor %}
            </table>
        </div>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        }
    </script>
</body>
</html>

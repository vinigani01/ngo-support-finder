<!DOCTYPE html>
<html>
<head>
    <title>Manage Users - NGO Support Finder</title>
    <link rel="stylesheet" href="/static/style.css">
    <script>if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');</script>
</head>
<body>
    <header class="modern-header">
        <div class="logo-container">
            <span class="logo-icon">💙</span>
            <span class="logo-text">NGO Support Finder</span>
        </div>
        <nav class="modern-nav">
            <a href="/admin" class="modern-nav-link">Back to Admin</a>
            <button onclick="toggleTheme()" class="theme-toggle-btn">🌗 Theme</button>
        </nav>
    </header>

    <div class="modern-bg">
        <div class="modern-card wide">
            <h2 style="margin-bottom:20px;">Registered Users</h2>
            <table class="modern-table">
                <tr><th>ID</th><th>Username</th><th>Role</th><th>Actions</th></tr>
                {% for user in users %}
                <tr>
                    <td>{{ user[0] }}</td>
                    
                    <td>{{ user[1] }}</td>
                    
                    <td>
                        <span class="{% if user[3] == 'admin' %}role-admin{% else %}role-user{% endif %}">
                            {{ user[3] }}
                        </span>
                    </td>
                    <td>
                        <a href="/edit_user/{{user[0]}}" class="modern-btn" style="padding:6px 12px; font-size:0.8em; background:var(--accent);">Edit</a>
                        
                        {% if user[3] != 'admin' %}
                        <a href="/delete_user/{{user[0]}}" class="modern-btn" style="padding:6px 12px; font-size:0.8em; background:#ef4444; margin-left:8px;" onclick="return confirm('Delete this user?');">Delete</a>
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
            </table>
        </div>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        }
    </script>
</body>
</html>
